name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time. Don't cancel a run in progress — half-deploying a
# site is worse than deploying it twice.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build the production site and publish it to GitHub Pages. Only on main, and
  # only once the smoke tests have passed.
  #
  # This pushes the built site to the `gh-pages` branch rather than uploading an
  # artifact via actions/deploy-pages. The artifact route needs Pages configured
  # with build_type "workflow", which means the site can ONLY ever be published
  # by a green Actions run -- so when Actions is unavailable there is no way to
  # ship a fix. Publishing a branch keeps a hand deploy possible from a laptop:
  #
  #   npm run build && cd dist && git init -b gh-pages && git add -A \
  #     && git commit -m "Publish" && git push -f <remote> gh-pages
  #
  # The branch is disposable and always force-pushed; it holds build output
  # only, and nothing should ever be authored on it.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Jekyll would otherwise swallow any path beginning with an underscore.
      - run: touch dist/.nojekyll
      # Done with plain git rather than a third-party publish action: this needs
      # contents: write on the repo, and a handful of porcelain commands is a
      # smaller thing to trust than another supply-chain dependency.
      - name: Publish dist to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          # Force-push a single orphan commit: the branch is build output, so
          # history on it is worth nothing and would only grow forever.
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
